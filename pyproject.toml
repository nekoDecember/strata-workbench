[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-workbench"
version = "0.1.0"
description = "A local-first, Python-connected exploratory data workbench"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "polars>=1.29,<2", "pandas>=2.2,<3", "pyarrow>=19,<24",
  "numpy>=2.1,<3", "scipy>=1.15,<2", "statsmodels>=0.14,<1",
  "plotly>=6,<7", "matplotlib>=3.10,<4", "openpyxl>=3.1,<4",
  "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]
notebook = ["jupyterlab>=4.4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["strata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
